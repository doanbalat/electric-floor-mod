[mod-setting-name]
pass-interval=Update interval (ticks)
chunks-per-pass=Completed network jobs per tick
work-per-tick=Network work per tick

[mod-setting-description]
pass-interval=Ticks between checks that start queued floor updates. Work already in progress continues in small steps every tick.
chunks-per-pass=Maximum completed chunk or pole jobs per tick, also limited by the network work budget.
work-per-tick=Maximum small network work units per tick. Lower values reduce update bursts but increase the delay before large floor edits finish conducting.
